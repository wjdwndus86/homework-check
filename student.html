<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>informatics · 학생</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: editorial ink-on-white header from the travel log, then soft rounded panels: task tabs, summary tiles, class cards, a student tile grid, and a per-task ledger. */
:root{
  --bg:#FFFFFF; --ink:#111111; --muted:#8A8A8A; --faint:#C9C9C9; --rule:#E7E7E7; --fill:#F5F5F4;
  --done:#111111; --done-ink:#FFFFFF;
  --miss:#D7301F; --miss-bg:#FDF1EF;
  --memo:#D9961A; --radius:12px; --radius-sm:8px;
  --font:"Inter Tight","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --ink:#F2F2F2; --muted:#8C8C8C; --faint:#4A4A4A; --rule:#262626; --fill:#181818;
  --done:#F2F2F2; --done-ink:#0E0E0E; --memo:#F0B23E; --miss:#FF6B57; --miss-bg:#2A1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --ink:#F2F2F2; --muted:#8C8C8C; --faint:#4A4A4A; --rule:#262626; --fill:#181818;
  --done:#F2F2F2; --done-ink:#0E0E0E; --memo:#F0B23E; --miss:#FF6B57; --miss-bg:#2A1512; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(24px,env(safe-area-inset-right,0px)) 72px max(24px,env(safe-area-inset-left,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.lab{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* top + wordmark */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:18px}
.brand{font-weight:600;letter-spacing:.02em}
.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.status.saving .dot{background:var(--faint);animation:pulse 1s infinite}
.status.local .dot,.status.err .dot{background:var(--miss)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wordmark{font-size:clamp(44px,9vw,112px);font-weight:700;letter-spacing:-.05em;line-height:.9;margin:14px 0 0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 28px;padding-top:16px;padding-bottom:18px;border-bottom:1px solid var(--ink)}
.meta span{color:var(--muted)} .meta b{font-weight:500;color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.gate{display:flex;flex-direction:column;gap:12px;align-items:center}
.gate p{margin:0;max-width:52ch;line-height:1.6}

/* task tabs */
.tasks{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tab{border:1px solid var(--rule);background:var(--bg);border-radius:var(--radius-sm);padding:9px 14px;font-weight:600;font-size:13.5px;display:inline-flex;gap:8px;align-items:baseline}
.tab small{font-weight:500;color:var(--muted);font-size:11.5px}
.tab:hover{border-color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-pressed="true"] small{color:inherit;opacity:.65}
.tab.add{border-style:dashed;color:var(--muted);font-weight:500}
.tab.add:hover{color:var(--ink)}
.addform,.renform{display:flex;gap:8px;align-items:center}
.field{border:1px solid var(--rule);background:var(--bg);border-radius:var(--radius-sm);padding:8px 12px;font-size:13.5px;min-width:0;outline:none}
.field:focus{border-color:var(--ink)}
.btn{border:1px solid var(--rule);background:var(--bg);border-radius:var(--radius-sm);padding:8px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--miss)}
.btn.danger:hover{border-color:var(--miss)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.taskhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px}
.taskhead h2{margin:0;font-size:clamp(24px,3vw,34px);font-weight:600;letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
.taskhead .acts{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;justify-content:flex-end}

.titlewrap{display:flex;align-items:center;gap:10px;min-width:0}
.iconbtn{border:1px solid var(--rule);background:var(--bg);border-radius:var(--radius-sm);height:34px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.iconbtn:hover{border-color:var(--ink);color:var(--ink)}
.iconbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.filter{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.filter input{accent-color:var(--ink)}
.edithead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--fill);border-radius:var(--radius-sm);padding:10px 12px}
.edithead .field{width:84px}
.edithead #stuName{width:140px}
.edithead .err{color:var(--miss);font-size:12.5px;font-weight:600}
.edithead .sp{flex:1}
.grid.editing .st{border:1.5px solid var(--rule);background:var(--bg);color:var(--ink);cursor:default}
.grid.editing .st .s{color:var(--muted);opacity:1}
.st .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--miss);color:#fff;display:grid;place-items:center;font-size:13px;line-height:1;padding:0;cursor:pointer}
.st .x:hover{filter:brightness(.9)}
.toast{display:flex;gap:14px;align-items:center}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}

/* summary tiles */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--fill);border-radius:var(--radius);padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.stat .v{font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.03em;line-height:1}
.stat .v small{font-size:.55em;font-weight:500;color:var(--muted);letter-spacing:0}
.stat.miss .v{color:var(--miss)}

/* panels */
.panel{border:1px solid var(--rule);border-radius:var(--radius);padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ph h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.ph .hint{color:var(--muted);font-size:12.5px}

/* class rows */
.rows{display:flex;flex-direction:column;gap:6px}
.ccards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ccard{border:1px solid var(--rule);background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px 11px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard:hover{border-color:var(--faint)}
.ccard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink)}
.ccard .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ccard .cn{font-weight:700;font-size:15px}
.ccard .cp{font-weight:600;font-size:13px}
.ccard .sub{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.ccard .sub .m{color:var(--miss);font-weight:600}
.ccard .sub .m.ok{color:var(--muted);font-weight:500}
.track{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;display:block}
.track i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .3s}

/* student grid */
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12.5px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .ld{background:var(--done)}
.legend .lm{border:1.5px dashed var(--miss);background:var(--miss-bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.st{position:relative;border-radius:var(--radius-sm);padding:10px 6px 9px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;
  border:1.5px dashed var(--miss);background:var(--miss-bg);color:var(--ink);transition:background .15s,color .15s,transform .1s}
.st:active{transform:scale(.97)}
.st .n{font-size:18px;font-weight:700;line-height:1.1}
.st .nm{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.st .s{font-size:11px;font-weight:600;color:var(--miss);letter-spacing:.02em}
.st.on{border:1.5px solid var(--done);background:var(--done);color:var(--done-ink)}
.st.on .s{color:inherit;opacity:.7}
.st:hover{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--faint)}
.st.flash{animation:flash 1.4s 2}
@keyframes flash{50%{box-shadow:0 0 0 2px var(--bg),0 0 0 5px var(--ink)}}
.grid.ro .st{cursor:default}
.missbox{background:var(--miss-bg);border-radius:var(--radius-sm);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.missbox .l{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0}
.missbox b{color:var(--miss);font-weight:700;white-space:nowrap}
.missbox .list{color:var(--ink);line-height:1.7}
.missbox.clear b{color:var(--ink)}
.missbox.clear{background:var(--fill)}

/* ledger */
.ledger{overflow:auto;max-height:320px;border:1px solid var(--rule);border-radius:var(--radius-sm)}
.ledger table{border-collapse:collapse;width:100%;font-size:13px}
.ledger th,.ledger td{padding:4px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;text-align:center}
.ledger tr:last-child td{border-bottom:0}
.ledger thead th{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--fill);position:sticky;top:0;z-index:1;padding-block:7px}
.ledger th.h-task{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.ledger th.cur{color:var(--ink)}
.ledger td.left,.ledger th.left{text-align:left}
.ledger td.nm{font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.dot.y{background:var(--done)}
.dot.x{border:1.5px solid var(--miss)}
.ledger td.cnt{font-weight:700}
.ledger td.cnt.bad{color:var(--miss)}

/* search */
.search{position:relative;width:min(240px,100%);flex:0 1 240px}
.search input{width:100%;padding-left:32px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.7}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--bg);border:1px solid var(--ink);border-radius:var(--radius-sm);z-index:20;max-height:280px;overflow:auto}
.results button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:9px 12px;font-weight:500}
.results button+button{border-top:1px solid var(--rule)}
.results button:hover,.results button.on{background:var(--ink);color:var(--bg)}
.results small{opacity:.65}
.results .none{padding:10px 12px;color:var(--muted)}

.empty{border:1px dashed var(--faint);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;z-index:50}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--miss-bg);border-radius:var(--radius-sm);padding:10px 12px}
.confirm span{color:var(--miss);font-weight:600;font-size:13px}

@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ccards{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:420px){
  body{padding-left:16px;padding-right:16px}
  .panel{padding:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  .ccards{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---- v3: 보충 · 메모 · 제출 · PIN · 수업 화면 ---- */
.legend .ll{border:1.5px solid var(--ink);background:var(--fill)}
.legend .lmemo{width:0;height:0;border-radius:0;border-top:11px solid var(--memo);border-left:11px solid transparent}
.st.late{border:1.5px solid var(--ink);background:var(--fill);color:var(--ink)}
.st.late .s{color:var(--ink)}
.st.memo::after{content:"";position:absolute;top:0;right:0;border-top:14px solid var(--memo);border-left:14px solid transparent;border-top-right-radius:6px}
.st .pin{font-size:13px;font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.st .pin.none{color:var(--miss);letter-spacing:0;font-weight:600;font-size:11px}
.grid.pins .st{border:1.5px solid var(--rule);background:var(--bg);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot.l{border:1.5px solid var(--done);background:linear-gradient(90deg,var(--done) 50%,transparent 50%)}
.dot.s{background:var(--done);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--done)}
textarea.field{width:100%;min-height:96px;resize:vertical;line-height:1.55;font:inherit}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);border-radius:var(--radius);width:min(540px,100%);max-height:90vh;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:19px;letter-spacing:-.02em}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.answer{background:var(--fill);border-radius:var(--radius-sm);padding:10px 12px;white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:5px 11px;font-size:12.5px;background:var(--bg)}
.chip:hover{border-color:var(--ink)}
.chip b{color:var(--miss);font-weight:700}
.subs{display:flex;flex-direction:column;max-height:340px;overflow:auto;border:1px solid var(--rule);border-radius:var(--radius-sm)}
.subrow{display:grid;grid-template-columns:40px 72px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 12px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;font-size:13px;width:100%}
.subrow:last-child{border-bottom:0}
.subrow:hover{background:var(--fill)}
.subrow .ans{white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.subrow small{color:var(--muted);white-space:nowrap}
.pubgrid{display:grid;gap:10px}
.linkrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:8px}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--ink)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--muted);vertical-align:middle}
.pill.on{background:var(--ink);color:var(--bg)}
details.panel>summary{cursor:pointer;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary .ph h3::after{content:" ▾";color:var(--muted);font-weight:500}
details.panel[open]>summary .ph h3::after{content:" ▴"}
.screen{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;flex-direction:column;gap:18px;padding:max(20px,env(safe-area-inset-top,0px)) 28px 28px;overflow:auto}
.screen .bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:14px}
.screen h2{margin:0;font-size:clamp(30px,4.6vw,64px);letter-spacing:-.04em;line-height:1}
.screen .cnt{font-size:clamp(16px,1.8vw,22px);font-weight:600}
.screen .cnt b{color:var(--miss)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.sgrid .st{padding:16px 8px 14px;cursor:default}
.sgrid .st .n{font-size:clamp(30px,3.4vw,46px)}
.sgrid .st .s{font-size:13px}
.sgrid .st .nm{font-size:14px}
.sgrid .st:hover{box-shadow:none}
@media (max-width:640px){ .linkrow{grid-template-columns:1fr} .subrow{grid-template-columns:34px minmax(0,1fr);} .subrow .ans,.subrow small{grid-column:1/-1} }

</style>
<style>
.page{max-width:820px}
.wordmark{font-size:clamp(40px,8vw,84px)}
.login{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}
.login label{display:flex;flex-direction:column;gap:6px}
.login .field{width:100%}
.card{border:1px solid var(--rule);border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:22px;letter-spacing:-.02em;text-wrap:balance}
.card .q{margin:0;white-space:pre-wrap;line-height:1.65}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:var(--radius-sm);padding:9px 14px;font-weight:600;color:var(--ink);text-decoration:none}
.links a:hover{background:var(--ink);color:var(--bg)}
.links svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ok{color:var(--ink);font-weight:600;font-size:13px}
.err{color:var(--miss);font-weight:600;font-size:13px}
@media (max-width:560px){ .login{grid-template-columns:1fr 1fr} .login .btn{grid-column:1/-1} }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="topbar">
      <div class="brand">정보 · 학생</div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">불러오는 중</span></div>
    </div>
    <h1 class="wordmark">informatics</h1>
    <div class="meta" id="meta"><span>반 · 번호 · PIN으로 들어와요</span></div>
  </header>
  <div id="main"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase 설정 (index.html과 student.html이 함께 써요)
const firebaseConfig = {
  apiKey: "AIzaSyCrG1xj4wQMuphNEhg8XdzNcYNzwdYbYxY",
  authDomain: "homework-check-a0397.firebaseapp.com",
  projectId: "homework-check-a0397",
  storageBucket: "homework-check-a0397.firebasestorage.app",
  messagingSenderId: "686630650425",
  appId: "1:686630650425:web:a2774173fc5b8d7d7983e8"
};


const fs = getFirestore(initializeApp(firebaseConfig));
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = "informatics-student";
const load = () => { try{ return JSON.parse(localStorage.getItem(LS)||"{}"); }catch(e){ return {}; } };
const save = o => { try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){} };

let me = load().me || null;          // {c, n, pin}
let tasks = [], loaded = false, loginErr = "", busy = false;
const sending = {};

function setStatus(kind, text){ $("#status").className="status "+kind; $("#statusText").textContent=text; }
function safeUrl(u){
  u = String(u||"").trim();
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[\w\-./%#?=&]+$/.test(u) && !/^\/\//.test(u)) return u;
  return null;
}
function fmt(ms){ const d=new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

onSnapshot(query(collection(fs,"pub"), where("open","==",true)), snap=>{
  tasks = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  loaded = true; setStatus("", "연결됨"); render();
}, ()=>{ setStatus("err","과제를 불러오지 못했어요"); loaded = true; render(); });

async function login(c, n, pin){
  loginErr = "";
  c = Math.round(Number(c)); n = Math.round(Number(n)); pin = String(pin||"").trim();
  if (!(c>0 && c<100) || !(n>0 && n<100)){ loginErr="반과 번호를 숫자로 적어 주세요."; render(); return; }
  if (!/^\d{4}$/.test(pin)){ loginErr="PIN은 선생님께 받은 숫자 4자리예요."; render(); return; }
  busy = true; render();
  try{
    await setDoc(doc(fs,"seen",`${c}-${n}`), {c, n, pin, at: serverTimestamp()});
    me = {c, n, pin}; const s = load(); s.me = me; save(s);
  }catch(e){
    loginErr = e && e.code==="permission-denied" ? "반 · 번호 · PIN이 맞지 않아요. 다시 확인해 주세요." : "인터넷 연결을 확인하고 다시 해 주세요.";
  }
  busy = false; render();
}
async function submit(t){
  const ta = document.getElementById("a-"+t.id); const answer = ta.value.trim().slice(0,3000);
  if (!answer){ toast("답을 적어 주세요"); return; }
  sending[t.id] = true; render();
  try{
    await setDoc(doc(fs,"subs",`${t.id}__${me.c}-${me.n}`), {taskId:t.id, c:me.c, n:me.n, pin:me.pin, answer, at:serverTimestamp()});
    const s = load(); s.sent = s.sent||{}; s.sent[t.id+"__"+me.c+"-"+me.n] = {answer, at:Date.now()}; if (s.draft) delete s.draft[t.id]; save(s);
    toast("제출했어요");
  }catch(e){
    if (e && e.code==="permission-denied"){
      toast("제출하지 못했어요. 과제가 닫혔거나 PIN이 바뀌었을 수 있어요.");
    } else toast("인터넷 연결을 확인하고 다시 제출해 주세요.");
  }
  sending[t.id] = false; render();
}

function render(){
  const m = $("#main");
  const ae = document.activeElement; const keep = ae && ae.id && ae.tagName==="TEXTAREA" ? {id:ae.id, s:ae.selectionStart} : null;
  if (!me){
    $("#meta").innerHTML = `<span>선생님께 받은 PIN으로 들어와요</span>`;
    m.innerHTML = `<form class="card" id="loginForm">
      <h2>들어가기</h2>
      <div class="login">
        <label><span class="lab">반</span><input class="field num" id="lc" type="number" inputmode="numeric" min="1" max="99" required></label>
        <label><span class="lab">번호</span><input class="field num" id="ln" type="number" inputmode="numeric" min="1" max="99" required></label>
        <label><span class="lab">PIN 4자리</span><input class="field num" id="lp" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required></label>
        <button class="btn solid" type="submit" ${busy?"disabled":""}>${busy?"확인 중…":"들어가기"}</button>
      </div>
      ${loginErr?`<span class="err">${esc(loginErr)}</span>`:""}
    </form>`;
    $("#loginForm").onsubmit = e=>{ e.preventDefault(); login($("#lc").value, $("#ln").value, $("#lp").value); };
    return;
  }
  const s = load();
  $("#meta").innerHTML = `<span><b class="num">${me.c}반 ${me.n}번</b></span><span><button class="linkbtn" id="out" type="button">다른 학생으로 들어가기</button></span>`;
  $("#out").onclick = ()=>{ const s=load(); delete s.me; save(s); me=null; render(); };
  if (!loaded){ m.innerHTML = `<div class="empty">과제를 불러오는 중이에요…</div>`; return; }
  if (!tasks.length){ m.innerHTML = `<div class="empty">지금 열려 있는 과제가 없어요.</div>`; return; }
  m.innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">${tasks.map(t=>{
    const sent = (s.sent||{})[t.id+"__"+me.c+"-"+me.n];
    const draft = (s.draft||{})[t.id];
    const links = (Array.isArray(t.links)?t.links:[]).map(l=>({label:String(l.label||l.url||""), url:safeUrl(l.url)})).filter(l=>l.url);
    return `<article class="card">
      <h2>${esc(t.title)}</h2>
      ${t.question?`<p class="q">${esc(t.question)}</p>`:""}
      ${links.length?`<div class="links">${links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}<svg viewBox="0 0 16 16"><path d="M6 3h7v7M13 3L5 11"/></svg></a>`).join("")}</div>`:""}
      <label class="lab" for="a-${esc(t.id)}">내 답</label>
      <textarea class="field" id="a-${esc(t.id)}" data-t="${esc(t.id)}" maxlength="3000" placeholder="여기에 답을 적어요">${esc(draft!=null?draft:(sent?sent.answer:""))}</textarea>
      <div class="foot">
        <span class="${sent?"ok":"note"} num">${sent?`제출 완료 · ${fmt(sent.at)} · 다시 제출하면 새 답으로 바뀌어요`:"아직 제출하지 않았어요"}</span>
        <button class="btn solid" data-sub="${esc(t.id)}" ${sending[t.id]?"disabled":""}>${sending[t.id]?"제출 중…":sent?"다시 제출":"제출하기"}</button>
      </div>
    </article>`; }).join("")}</div>`;
  m.querySelectorAll("textarea[data-t]").forEach(ta=>ta.oninput=()=>{ const s=load(); s.draft=s.draft||{}; s.draft[ta.dataset.t]=ta.value; save(s); });
  m.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>submit(tasks.find(t=>t.id===b.dataset.sub)));
  if (keep){ const el=document.getElementById(keep.id); if (el){ el.focus(); try{ el.setSelectionRange(keep.s,keep.s); }catch(e){} } }
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
render();
</script>
</body>
</html>
